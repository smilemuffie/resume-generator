<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历生成器 · Resume Generator</title>
  </head>
  <body>
    <div id="app">
      <!-- 顶栏：语言切换 + 模板下拉 + 导出按钮 -->
      <header class="toolbar">
        <div class="brand">
          <span class="brand-name">简历生成器</span>
          <span class="brand-sub">Resume Generator</span>
        </div>
        <div class="toolbar-actions">
          <div class="lang-toggle" role="group" aria-label="语言切换">
            <button type="button" class="lang-btn" data-lang="zh">中</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </div>
          <div class="theme-palette" role="group" aria-label="主题色"></div>
          <button type="button" class="btn-format">JSON模版下载</button>
          <button type="button" class="btn-export">导出 PDF</button>
        </div>
      </header>

      <!-- 主体：左编辑器 + 右预览 -->
      <main class="main">
        <section class="editor-pane">
          <div class="pane-title">
            <span class="pane-title-text">JSON 编辑器</span>
            <button type="button" class="pane-action" id="copy-btn" title="复制 JSON" aria-label="复制 JSON 内容">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>
          <div class="cm-host"></div>
        </section>
        <section class="preview-pane">
          <div class="pane-title">预览</div>
          <div class="preview-scroll"></div>
        </section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite">已复制</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
