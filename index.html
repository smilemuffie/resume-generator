<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历生成器 · Resume Generator</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div id="app">
      <!-- 顶栏：语言切换 + 模板下拉 + 导出按钮 -->
      <header class="toolbar">
        <div class="brand">
          <span class="brand-name">简历生成器</span>
          <span class="brand-sub">Resume Generator</span>
        </div>
        <div class="toolbar-actions">
          <label class="tpl-label">
            <span>模板</span>
            <select class="tpl-select" id="tpl-select" aria-label="选择模板">
              <option value="minimal">极简 Minimal</option>
              <option value="pure">纯净 Pure</option>
              <option value="tabular">表格 Tabular</option>
              <option value="basic">基础 Basic</option>
              <option value="modern">现代 Modern</option>
            </select>
          </label>
          <div class="lang-toggle" role="group" aria-label="语言切换">
            <button type="button" class="lang-btn" data-lang="zh">中</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </div>
          <div class="theme-palette" role="group" aria-label="主题色"></div>
          <button type="button" class="btn-help" id="settings-btn" title="配置" aria-label="预览配置">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
          <button type="button" class="btn-help" id="help-btn" title="使用说明" aria-label="使用说明">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          </button>
          <button type="button" class="btn-format">JSON模版下载</button>
          <button type="button" class="btn-export">导出 PDF</button>
        </div>
      </header>

      <!-- 主体：左编辑器 + 右预览 -->
      <main class="main">
        <section class="editor-pane">
          <div class="pane-title">
            <span class="pane-title-text">JSON 编辑器</span>
            <div class="pane-actions">
              <button type="button" class="pane-action" id="copy-btn" title="复制 JSON" aria-label="复制 JSON 内容">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
              <button type="button" class="pane-action" id="clear-btn" title="清空" aria-label="清空编辑器">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
              <button type="button" class="pane-action" id="export-json-btn" title="导出 JSON" aria-label="导出当前编辑器 JSON 数据">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              </button>
            </div>
          </div>
          <div class="cm-host"></div>
        </section>
        <section class="preview-pane">
          <div class="pane-title">预览</div>
          <div class="preview-scroll"></div>
        </section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite">已复制</div>
    <div class="modal-mask" id="clear-modal">
      <div class="modal" role="dialog" aria-modal="true" aria-label="确认清空">
        <div class="modal-title">清空编辑器</div>
        <div class="modal-desc">确认清空当前 JSON 内容？此操作不可撤销。</div>
        <div class="modal-actions">
          <button type="button" class="modal-btn modal-cancel" id="clear-cancel">取消</button>
          <button type="button" class="modal-btn modal-confirm" id="clear-confirm">确认清空</button>
        </div>
      </div>
    </div>

    <div class="modal-mask" id="settings-modal">
      <div class="modal" role="dialog" aria-modal="true" aria-label="预览配置">
        <div class="modal-head">
          <div class="modal-title">预览配置</div>
          <button type="button" class="modal-close" id="settings-close" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
          <label class="cfg-field">
            <input type="checkbox" id="cfg-work-stack" />
            <span>展示工作经历技术栈</span>
          </label>
          <label class="cfg-field">
            <input type="checkbox" id="cfg-project-stack" />
            <span>展示项目经历技术栈</span>
          </label>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
